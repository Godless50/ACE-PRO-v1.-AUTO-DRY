# Дашборд «Антенны NFC ACE Pro».
#
# Вставить как новый дашборд: Настройки — Панели — Добавить панель,
# затем в режиме правки «Редактировать в YAML» и вставить содержимое.
# Требует пакета ace_nfc.yaml (он создаёт сущности).
#
# Слоты сгруппированы по физическим платам считывателей: NFC1 обслуживает
# слоты 1-2, NFC2 — слоты 3-4. Если «не вижу» показывают оба слота одной
# платы, а на другой всё в порядке, дело в плате, а не в метках.

title: Антенны NFC ACE Pro
views:
  - title: Антенны
    path: nfc
    cards:
      - type: markdown
        content: >-
          ### Что показывает эта панель

          Данные берутся из заводской прошивки ACE. Она сообщает о чтении
          метки одним числом, и у этого числа есть слепое пятно:
          **«не вижу» и «вижу, но не распознал» — это одно и то же
          значение.** Различить пустой слот и слот с нечитаемой меткой по
          этим данным нельзя.

          Состояние «читаю» живёт доли секунды и при опросе раз в пять
          секунд почти никогда не попадает в кадр. Панель показывает
          **результат** чтения, а не процесс.

          Настоящее «вижу / не вижу» в момент опроса поля появится после
          патча прошивки с туннелем к регистрам считывателя.

          **Проверьте на своём устройстве.** По разбору второго поколения,
          на пару слотов приходится одна антенна. Если это верно и для
          первой ревизии, две метки в соседних слотах одной платы мешают
          друг другу.


# Инструмент разведки протокола ACE.
# Кладётся в printer_data/config/extended/klipper/ — этот каталог
# подключается строкой [include extended/klipper/*.cfg] в printer.cfg
# и не затрагивается обновлениями multiACE.
#
# Модуль ничего не делает сам по себе: он только регистрирует две команды,
# ACE_EXT_RAW и ACE_EXT_FRAME_LEN, и ждёт вызова вручную. Нужен для работы
# над прошивкой ACE и после неё не обязателен.
[ace_ext_raw]

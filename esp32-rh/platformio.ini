; Прошивка ESP32 внутри корпуса ACE Pro: читает Xiaomi LYWSD03MMC по BLE и
; отправляет влажность в Moonraker командой ACE_SET_RH.
;
; Два окружения с разными задачами:
;   native — тесты чистой логики на машине разработчика, без железа;
;   esp32  — собственно прошивка.
;
; default_envs задан осознанно: без него «pio run» попытался бы собрать и
; окружение native, где нет ни Arduino, ни точки входа.

[platformio]
default_envs = esp32

[env:native]
platform = native
test_framework = unity
; Каталог src в тестовую сборку не входит: параметр test_build_src по
; умолчанию равен no. Здесь же исключаем src и из обычной сборки, чтобы
; случайный «pio run -e native» не пытался компилировать код для Arduino.
build_src_filter = -<*>
build_flags =
    -std=gnu++17
    -Wall
    -Wextra

[env:esp32]
; Версия платформы закреплена намеренно: она тянет ядро Arduino 2.0.x, с
; которым проверена NimBLE 1.4.x и работает двухаргументная форма
; esp_task_wdt_init. На ядре 3.x обе эти вещи меняются, и прошивка
; молча перестала бы собираться после обновления платформы.
platform = espressif32@^6.9.0
board = esp32dev
framework = arduino
; Таблица разделов min_spiffs даёт два раздела приложения по ~1.9 МБ
; вместо стандартных 1.25 МБ. Со стандартной таблицей прошивка занимала
; 94.8% раздела: любое добавление кода переполнило бы его, а обновление по
; воздуху требует, чтобы новый образ целиком поместился во ВТОРОЙ раздел.
board_build.partitions = min_spiffs.csv
monitor_speed = 115200
upload_speed = 921600
build_flags =
    -std=gnu++17
    -Wall
    -DCORE_DEBUG_LEVEL=3
lib_deps =
    h2zero/NimBLE-Arduino@^1.4.2
    knolleary/PubSubClient@^2.8
    ayushsharma82/ElegantOTA@^3.1.6

; Прошивка по воздуху для платы, уже закрытой в корпусе. Адрес задаётся
; при вызове: pio run -e esp32_ota -t upload --upload-port 192.168.4.xx
[env:esp32_ota]
extends = env:esp32
upload_protocol = espota
